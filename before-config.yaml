receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  resourcedetection:
    detectors: [env, system]

exporters:
  otlp:
    endpoint: "otel-backend:4317"
    tls:
      insecure: true
    sending_queue:
      enabled: true
      batch:
        enabled: false 

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resourcedetection]
      exporters: [otlp]
