receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 350
    spike_limit_mib: 70

  resource_detection:
    detectors: [env, system]
    system:
      resource_attributes:
        host.name:
          enabled: true
        os.type:
          enabled: true
        host.arch:
          enabled: false
        host.cpu.model.name:
          enabled: false
        host.cpu.cache.l2.size:
          enabled: false

  transform/sanitize_spans:
    trace_statements:
      - context: span
        statements:
          - delete_key(attributes, "http.request.header.authorization")

  tail_sampling:
    decision_wait: 10s
    policies:
      - name: errors-policy
        type: status_code
        status_code: { status_codes: [ERROR] }
      - name: probabilistic-policy
        type: probabilistic
        probabilistic: { sampling_percentage: 5 }

exporters:
  otlp_grpc:
    endpoint: "otel-backend:4317"
    tls:
      insecure: true
    sending_queue:
      enabled: true
      sizer: items
      queue_size: 100000
      batch:
        enabled: true
        min_size: 8192
        flush_timeout: 200ms

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, transform/sanitize_spans, tail_sampling]
      exporters: [otlp_grpc]
